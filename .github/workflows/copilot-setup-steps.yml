name: "Copilot Setup Steps"

# Prepares the environment for the Copilot coding agent working on this repository:
# Python for the build/lint/test tooling and the gh-aw CLI for agentic workflow authoring.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot coding agent
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@53d0749e19424a918acd82b4d140264ce48f2f14 # v1.2.2
        with:
          version: v1.2.2
      - name: Verify repository tooling
        run: python3 .github/scripts/build.py --check && python3 .github/scripts/content_lint.py
